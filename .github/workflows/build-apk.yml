name: Build & Release SymphonySync APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore cached signing keystore (keeps updates compatible on TS10)
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: symphony-debug-keystore-v1

      - name: Ensure debug.keystore exists for debugConfig signing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Extract versionName from app/build.gradle.kts
        id: version
        run: |
          VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VER" ]; then VER="1.0.0"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "SymphonySync-v${VER}.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SymphonySync-v${{ steps.version.outputs.version }}
          path: SymphonySync-v${{ steps.version.outputs.version }}.apk

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          APK="SymphonySync-v${{ steps.version.outputs.version }}.apk"
          TITLE="SymphonySync ${TAG}"
          NOTES="APK compilada automáticamente desde GitHub Actions para radio Android TS10."

          for attempt in 1 2 3 4 5; do
            echo "Publicando Release ${TAG} (intento ${attempt}/5)..."
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" "$APK" --clobber && \
                 gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest; then
                echo "Release ${TAG} actualizada correctamente."
                exit 0
              fi
            else
              if gh release create "$TAG" "$APK" \
                 --target "${{ github.sha }}" \
                 --title "$TITLE" \
                 --notes "$NOTES" \
                 --latest; then
                echo "Release ${TAG} creada correctamente."
                exit 0
              fi
            fi

            if [ "$attempt" -lt 5 ]; then
              WAIT=$((attempt * 10))
              echo "Error temporal de GitHub API; reintentando en ${WAIT}s..."
              sleep "$WAIT"
            fi
          done

          echo "No se pudo publicar la Release tras 5 intentos (el APK sigue disponible en Artifacts)."
          exit 1
