name: Build & Release SymphonySync APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore cached signing keystore (keeps updates compatible on TS10)
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: symphony-debug-keystore-v1

      - name: Ensure debug.keystore exists for debugConfig signing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Extract versionName from app/build.gradle.kts
        id: version
        run: |
          VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VER" ]; then VER="1.0.0"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "SymphonySync-v${VER}.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SymphonySync-v${{ steps.version.outputs.version }}
          path: SymphonySync-v${{ steps.version.outputs.version }}.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SymphonySync v${{ steps.version.outputs.version }}
          body: "APK compilada automáticamente desde GitHub Actions para radio Android TS10."
          files: SymphonySync-v${{ steps.version.outputs.version }}.apk
          make_latest: true
